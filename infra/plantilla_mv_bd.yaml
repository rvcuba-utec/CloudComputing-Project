AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudShop - MV de BASE DE DATOS. Abre 22, 8080 (Adminer) y MySQL 3306 / PostgreSQL 5432 solo desde la VPC."

Parameters:
  InstanceName:
    Type: String
    Default: "MV BD CloudShop"
    Description: "Nombre de la instancia a crear"
  AMI:
    Type: String
    Default: "ami-0b33d2f1547e52c78"
    Description: "ID de AMI (Cloud9Ubuntu22 con Docker)"
  InstanceType:
    Type: String
    Default: "t3.micro"
    Description: "Tipo de instancia"
  OrigenBdCidr:
    Type: String
    Default: "172.31.0.0/16"
    Description: "CIDR desde el que se aceptan conexiones a MySQL/PostgreSQL (por defecto, toda la VPC). Ajusta al CIDR de tu VPC."

Resources:
  EC2Instance:
    Type: "AWS::EC2::Instance"
    Properties:
      Tags:
        - Key: "Name"
          Value: !Ref InstanceName
      ImageId: !Ref AMI
      InstanceType: !Ref InstanceType
      KeyName: "vockey"
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: "20"

  InstanceSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "CloudShop BD: SSH 22, Adminer 8080, MySQL 3306 y PostgreSQL 5432 desde la VPC"
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: "22"
          ToPort: "22"
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: "8080"
          ToPort: "8080"
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: "3306"
          ToPort: "3306"
          CidrIp: !Ref OrigenBdCidr
        - IpProtocol: "tcp"
          FromPort: "5432"
          ToPort: "5432"
          CidrIp: !Ref OrigenBdCidr

Outputs:
  InstanceId:
    Description: "ID de la instancia EC2"
    Value: !Ref EC2Instance
  InstancePublicIP:
    Description: "IP publica de la instancia"
    Value: !GetAtt EC2Instance.PublicIp
  InstancePrivateIP:
    Description: "IP privada (usar en el .env del backend)"
    Value: !GetAtt EC2Instance.PrivateIp
  DatabaseSecurityGroupId:
    Description: "ID del security group de la MV de datos"
    Value: !Ref InstanceSecurityGroup
